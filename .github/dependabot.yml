version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # FrankenPHP : pas de saut de majeure automatique
      - dependency-name: "dunglas/frankenphp"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PostgreSQL reste sur la 16 (migration de majeure manuelle : dump/restore des données)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Projet sensible : on reste sur Symfony 7.4 (LTS). Pas de passage à 8.x.
      - dependency-name: "symfony/*"
        versions: [">=8.0.0"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
